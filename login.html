<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="description" content="Entre para acompanhar suas finanças no Controle de Gastos." />
    <title>Entrar · Controle de Gastos</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/login.js"></script>
  </head>
  <body class="font-geist text-white antialiased">
    <main class="login-page relative isolate grid min-h-screen place-items-center overflow-hidden bg-gradient-to-br from-brand-indigo to-brand-purple px-4 py-10 sm:px-6">
      <div class="login-orb login-orb--top-left" aria-hidden="true"></div>
      <div class="login-orb login-orb--bottom-right" aria-hidden="true"></div>
      <div class="login-orb login-orb--center-right" aria-hidden="true"></div>

      <div class="relative z-10 flex w-full flex-col items-center gap-6">
        <section class="login-card login-card-in w-full max-w-md rounded-3xl border border-white/20 bg-white/10 p-7 shadow-login-glow backdrop-blur-xl sm:p-10" aria-labelledby="login-title">
          <header class="brand mb-8 flex flex-col items-center text-center sm:mb-10">
            <img class="brand-logo mb-6 size-20 rounded-2xl shadow-xl shadow-violet-950/40" src="/piggy-logo.png" alt="Cofrinho roxo" width="80" height="80" />
            <h1 class="text-3xl font-bold tracking-tight text-white" id="login-title">Controle de Gastos</h1>
            <p class="mt-3 max-w-xs text-sm leading-relaxed text-brand-lilac-light/85">Gerencie suas finanças de forma simples e inteligente.</p>
          </header>

          <form class="login-form grid gap-5" id="login-form" novalidate>
            <div class="field grid gap-2">
              <label class="text-sm text-brand-lilac-light/90" for="email">Email</label>
              <div class="input-wrap relative">
                <svg class="field-icon pointer-events-none absolute left-4 top-1/2 size-5 -translate-y-1/2 text-brand-lilac-light/65" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
                <input class="login-input h-12 w-full rounded-xl border border-white/20 bg-white/10 pl-12 pr-4 text-sm text-white outline-none transition duration-200 placeholder:text-brand-lilac-light/55 focus:border-brand-lilac" id="email" name="email" type="email" placeholder="Digite seu email" autocomplete="email" />
              </div>
            </div>

            <div class="field grid gap-2">
              <label class="text-sm text-brand-lilac-light/90" for="password">Senha</label>
              <div class="input-wrap relative">
                <svg class="field-icon pointer-events-none absolute left-4 top-1/2 size-5 -translate-y-1/2 text-brand-lilac-light/65" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="4" y="10" width="16" height="11" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input class="login-input h-12 w-full rounded-xl border border-white/20 bg-white/10 pl-12 pr-12 text-sm text-white outline-none transition duration-200 placeholder:text-brand-lilac-light/55 focus:border-brand-lilac" id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" />
                <button class="password-toggle absolute right-2 top-1/2 grid size-9 -translate-y-1/2 place-items-center rounded-lg text-brand-lilac-light/75 transition hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-brand-lilac" id="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="size-5" data-eye-open hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="size-5" data-eye-closed viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a13.8 13.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-options mt-1 flex items-center justify-between gap-3">
              <label class="remember inline-flex cursor-pointer items-center gap-2.5 text-sm text-brand-lilac-light/90" for="remember">
                <input class="size-4 accent-brand-purple" id="remember" name="remember" type="checkbox" />
                <span>Lembrar de mim</span>
              </label>
              <button class="forgot-link rounded-sm text-sm text-brand-lilac transition hover:text-white hover:underline focus-visible:outline-2 focus-visible:outline-brand-lilac" type="button">Esqueci minha senha</button>
            </div>

            <p class="form-message mt-1 rounded-xl border border-rose-200/30 bg-rose-950/35 px-3 py-3 text-sm leading-relaxed text-rose-50" id="form-message" role="alert" aria-live="polite" hidden></p>
            <button class="login-submit mt-1 flex min-h-12 w-full items-center justify-center rounded-xl bg-gradient-to-r from-brand-purple to-brand-lilac px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-violet-950/35 transition duration-200 hover:-translate-y-0.5 hover:from-brand-purple-dark hover:to-brand-purple active:translate-y-0 disabled:cursor-wait disabled:opacity-60" id="submit-button" type="submit">
              <span class="button-label">Entrar</span>
            </button>
          </form>

          <p class="secure-note mt-8 flex items-center justify-center gap-2 text-center text-xs leading-relaxed text-brand-lilac-light/60">
            <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <span>Suas informações financeiras ficam protegidas.</span>
          </p>
        </section>
        <p class="page-footer text-xs text-white/55">Feito com 💜</p>
      </div>
    </main>
  </body>
</html>
